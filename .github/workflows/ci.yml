name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests, lint, kernels
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $XCODE"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Lint (swift format)
        run: swift format lint --strict --recursive Packages Apps Tools

      # Compile-only for now: byte-for-byte comparison needs path-independent builds (MOV-123).
      - name: Kernels compile
        run: sh Tools/build-kernels.sh

      - name: Engine tests
        working-directory: Packages/EmulsionCore
        env:
          EMULSION_REGRESSION_REPORT: ${{ runner.temp }}/visual-regression
          EMULSION_REGRESSION_IMAGES: all
        run: swift test

      - name: Visual regression summary
        if: always()
        run: |
          REPORT="$RUNNER_TEMP/visual-regression/report.md"
          if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload visual regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4, MIT
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-regression
          if-no-files-found: warn
          retention-days: 14

      - name: App logic tests (EmulsionKit)
        working-directory: Packages/EmulsionKit
        shell: bash
        run: swift test 2>&1 | tee "$RUNNER_TEMP/emulsionkit-macos-tests.log"

      - name: Shared UI interaction tests (EmulsionUI)
        working-directory: Packages/EmulsionUI
        run: swift test

      - name: App logic tests on iOS (EmulsionKit)
        working-directory: Packages/EmulsionKit
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in sorted(devices, reverse=True) for d in devices[runtime] if d["name"] == "iPhone 17 Pro"))')
          xcodebuild test -scheme EmulsionKit -destination "platform=iOS Simulator,id=$DEVICE_ID"

      - name: Mac app builds
        run: xcodebuild -project Apps/macOS/Emulsion.xcodeproj -scheme Emulsion -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      # MOV-127: retain the crashing frame if the Swift Testing process exits with signal 11 again.
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4, MIT
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulsionkit-macos-tests.log
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: warn
          retention-days: 14
